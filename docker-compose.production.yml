version: '3.8'

services:
  app:
    container_name: zerodotemail-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/zerodotemail
      - REDIS_URL=http://redis-proxy:80
      - REDIS_TOKEN=${REDIS_TOKEN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL}
      - BETTER_AUTH_TRUSTED_ORIGINS=${NEXT_PUBLIC_APP_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_SYSTEM_PROMPT=${AI_SYSTEM_PROMPT}
    volumes:
      - app-data:/app

  db:
    container_name: zerodotemail-db
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zerodotemail
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    container_name: zerodotemail-redis
    image: docker.io/bitnami/valkey:8.0
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - VALKEY_PASSWORD=${REDIS_PASSWORD}
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    volumes:
      - redis-data:/bitnami/valkey/data
    ports:
      - "6379:6379"

  redis-proxy:
    container_name: zerodotemail-redis-proxy
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${REDIS_TOKEN}
      SRH_CONNECTION_STRING: "redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "8079:80"
    depends_on:
      - redis

volumes:
  app-data:
  postgres-data:
  redis-data: 